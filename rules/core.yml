      semgrep.dev/legal/rules-license
    vulnerability_class:
    - XML Injection
    source: 
      https://semgrep.dev/r/python.lang.security.use-defused-xml-parse.use-defused-xml-parse
    shortlink: https://sg.run/n3jG
    semgrep.dev:
      rule:
        r_id: 72436
        rv_id: 1263541
        rule_id: X5Uqnx
        version_id: vdT06ER
        url: 
          https://semgrep.dev/playground/r/vdT06ER/python.lang.security.use-defused-xml-parse.use-defused-xml-parse
        origin: community
        path: python.lang.security.use-defused-xml-parse.use-defused-xml-parse
  message: The native Python `xml` library is vulnerable to XML External Entity 
    (XXE) attacks.  These attacks can leak confidential data and "XML bombs" can
    cause denial of service. Do not use this library to parse untrusted input. 
    Instead  the Python documentation recommends using `defusedxml`.
  languages:
  - python
  severity: ERROR
  patterns:
  - pattern: xml.etree.ElementTree.parse($...ARGS)
  - pattern-not: xml.etree.ElementTree.parse("...")
  fix: defusedxml.etree.ElementTree.parse($...ARGS)
